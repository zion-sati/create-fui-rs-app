name: create-fui-rs-app CI

on:
  push:
    branches: [main]
    paths: &ci_inputs
      - '.github/workflows/create-fui-rs-app-ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'update-deps.sh'
      - 'tsconfig.json'
      - 'eslint.config.ts'
      - 'README.md'
      - 'LICENSE.md'
      - 'src/**'
      - 'templates/**'
      - 'tests/**'
      - 'scripts/ci/**'
      - 'scripts/publish/**'
      - 'scripts/update-upstream-versions.mjs'
  pull_request:
    paths: *ci_inputs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install dependencies
        run: npm ci
      - name: Test package and generated applications
        run: npm run publish:local
